# 使用前请复制 .env.example 为 .env 并填写 TOKEN / SUPER_USER 等变量
# 启动：docker compose up -d --build
---
services:
  torrentino:
    # 本地构建打上汉化分支的代码；也可以改成自己的镜像地址
    build: .
    image: transmission-telegram-bot:zh
    container_name: transmission-telegram-bot
    # 与 Transmission 使用同一个 UID/GID，避免 config 目录权限问题
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - TRANSMISSION_HOST=transmission
      - TRANSMISSION_PORT=9091
      - TRANSMISSION_USER=${TRANSMISSION_USER:?请先设置 TRANSMISSION_USER}
      - TRANSMISSION_PASSWORD=${TRANSMISSION_PASSWORD:?请先设置 TRANSMISSION_PASSWORD}
      - TOKEN=${TOKEN:?请先设置 TOKEN}
      - SUPER_USER=${SUPER_USER:?请先设置 SUPER_USER}
      - DOWNLOAD_LOG=/usr/src/app/config/download.log
      - LOG_FILE=/usr/src/app/config/torrentino.log
    depends_on:
      transmission:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # 机器人配置、授权用户、下载历史、通知队列与日志都在这里
      - ./config:/usr/src/app/config

  transmission:
    image: lscr.io/linuxserver/transmission:4.1.1-r1-ls345
    container_name: transmission
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # 改成你宿主机上拥有下载目录权限的用户 ID
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - USER=${TRANSMISSION_USER:?请先设置 TRANSMISSION_USER}
      - PASS=${TRANSMISSION_PASSWORD:?请先设置 TRANSMISSION_PASSWORD}
    volumes:
      # 下载目录：FC2 / 有码 / 无码 / 国产 / 未分类 会自动创建在下面
      - ./downloads:/downloads
      - ./config/transmission:/config
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9091/transmission/web/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

